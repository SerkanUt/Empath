<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#f8f8fb;color:#111827;font:500 14px Manrope,sans-serif;display:flex}
.side{width:230px;background:#fff;border-right:1px solid #e5e7eb;padding:24px 16px}.logo{font:800 18px Manrope;margin-bottom:26px}.n{padding:10px 12px;border-radius:8px;color:#4b5563}.n.on{background:#efeaff;color:#6d4aff;font-weight:700}
main{flex:1;padding:28px 36px}h1{font:800 24px Manrope}.sub{color:#6b7280;margin:4px 0 20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}.k{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px}.k small{color:#6b7280}.k b{display:block;font:800 28px Manrope;margin-top:6px}
.chart{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:20px;height:300px;margin-bottom:18px}
table{width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:10px;border-collapse:collapse}td,th{padding:12px 16px;text-align:left;border-bottom:1px solid #f0f1f3}th{color:#6b7280;font-weight:500}
</style></head><body><div class="side"><div class="logo">ReelReaction</div><div class="n">Videos</div><div class="n">Tests</div><div class="n on">Results</div><div class="n">Live</div></div>
