<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#fffdf8;color:#2a2438;font:500 17px Fredoka,sans-serif;padding:32px 56px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.logo{font:700 28px Fredoka}.logo b{color:#ff6fa5}
.steps{display:flex;gap:8px}.steps span{padding:9px 18px;border-radius:30px;background:#f1ecf7;font-weight:600}.steps .d{background:#ffd23f}.steps .on{background:#2a2438;color:#fff}
.main{display:grid;grid-template-columns:250px 1fr 270px;gap:48px}
.phone{height:640px;border-radius:28px;background:#2a2438;color:#fff;display:flex;align-items:flex-end;padding:20px;font:600 20px Fredoka}
h1{font:700 34px Fredoka;margin-bottom:28px}.row{display:flex;gap:16px;align-items:center}.row i{width:84px;font:600 14px Fredoka;font-style:normal;text-transform:uppercase;letter-spacing:.04em}
.bar{flex:1;display:flex;gap:4px;height:56px}.bar div{border-radius:14px;color:#2a2438;font:600 14px Fredoka;display:flex;align-items:center;padding-left:12px}
.diff{display:flex;gap:16px;align-items:center;margin:8px 0}.diff i{width:84px}.dots{flex:1;display:flex;gap:4px}.dots div{height:22px;display:flex;align-items:center;justify-content:center}.dots u{width:14px;height:14px;border-radius:50%;display:block}.dots s{width:14px;height:4px;background:#c9c2d6;border-radius:2px;display:block}
.key{display:flex;gap:18px;margin-top:30px;font-weight:600}.key span{display:flex;gap:8px;align-items:center}.key b{width:18px;height:18px;border-radius:6px;display:block}
.score{background:#ffd23f;border-radius:24px;padding:26px}.score b{font:700 96px/1 Fredoka;display:block}.score p{font:600 22px/1.3 Fredoka;margin-top:12px}
</style></head><body>
<div class="top"><div class="logo">Reel<b>Reaction</b></div><div class="steps"><span class="d">Video</span><span class="d">Intent</span><span class="d">Warm-up</span><span class="d">Watch</span><span class="on">Results</span></div></div>
<div class="main"><div class="phone">Morning routine</div>
<div><h1>Did it land?</h1>
<div class="row"><i>You meant</i><div class="bar"><div style="flex:4;background:#ff6fa5">Surprise</div><div style="flex:16;background:#ffd23f">Happy</div><div style="flex:12;background:#ff6fa5">Surprise</div></div></div>
<div class="diff"><i></i><div class="dots"><div style="flex:4"><s></s></div><div style="flex:16;justify-content:flex-start"><s style="width:70px"></s><u style="background:#ffd23f;margin-left:0"></u></div><div style="flex:12"><u style="background:#ff6fa5"></u></div></div></div>
<div class="row"><i>They felt</i><div class="bar"><div style="flex:7;background:#b8b2c4">Blank</div><div style="flex:14;background:#ffd23f">Happy</div><div style="flex:3;background:#b8b2c4"></div><div style="flex:8;background:#ff6fa5">Surprise</div></div></div>
<div class="key"><span><b style="background:#ffd23f"></b>Happy</span><span><b style="background:#ff6fa5"></b>Surprise</span><span><b style="background:#3b82f6"></b>Sad</span><span><b style="background:#e63946"></b>Angry</span><span><b style="background:#8b5cf6"></b>Fear</span><span><b style="background:#b8b2c4"></b>Neutral</span></div></div>
<div class="score"><b>71%</b><p>Your hook didn't land. Viewers stayed blank for 4 seconds.</p></div></div></body></html>
