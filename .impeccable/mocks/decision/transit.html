<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#0b1d3a;color:#fff;font:500 16px 'Hanken Grotesk',sans-serif;display:flex}
.rail{width:210px;padding:28px 20px;border-right:1px solid #24406b}.logo{font:800 20px 'Hanken Grotesk';margin-bottom:28px}.n{padding:10px 12px;border-radius:6px;color:#a9bcd8}.n.on{background:#16305a;color:#fff}
main{flex:1;padding:28px 40px}h1{font:800 30px 'Hanken Grotesk'}.sub{color:#a9bcd8;margin:4px 0 20px}
svg{width:100%;height:420px;display:block;background:#10284d;border-radius:10px}.legend{display:flex;gap:22px;margin-top:16px;font-weight:700}.legend span:before{content:"";display:inline-block;width:26px;height:8px;border-radius:4px;margin-right:8px;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.c{background:#16305a;border-radius:8px;padding:16px}.c b{font:800 30px 'Hanken Grotesk';display:block}
</style></head><body><div class="rail"><div class="logo">ReelReaction</div><div class="n">Videos</div><div class="n">Watch</div><div class="n on">Results</div></div>
<main><h1>Morning routine</h1><p class="sub">Each emotion is a line colour. Circles mark where your route and theirs meet.</p>
<svg viewBox="0 0 1000 420"><g stroke-width="12" fill="none" stroke-linecap="round"><path d="M40 130H120L170 80H520" stroke="#e11d48"/><path d="M40 300H300L350 250H520" stroke="#9ca3af"/><path d="M520 80H620L670 130H960" stroke="#f59e0b"/><path d="M520 250H700L750 200H960" stroke="#f59e0b"/><path d="M670 130L700 200" stroke="#f59e0b" stroke-width="4"/></g>
<g fill="#fff" stroke="#0b1d3a" stroke-width="5"><circle cx="760" cy="165" r="16"/><circle cx="920" cy="130" r="12"/><circle cx="920" cy="200" r="12"/></g>
<text x="40" y="112" fill="#fff" font-size="15" font-weight="700">You meant: Surprise</text><text x="40" y="332" fill="#fff" font-size="15" font-weight="700">They felt: Blank</text><text x="560" y="60" fill="#fff" font-size="15" font-weight="700">Happy</text></svg>
<div class="legend"><span style="--c:#f59e0b">Happy</span><span style="--c:#e11d48">Surprise</span><span style="--c:#9ca3af">Blank</span></div>
<div class="grid"><div class="c"><b>71%</b>match</div><div class="c"><b>0:00</b>hook missed</div><div class="c"><b>+1.5 s</b>twist lag</div></div></main></body></html>
